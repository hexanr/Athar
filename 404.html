<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أثر</title>
  <script>
    (function () {
      var p = window.location.pathname;
      // GitHub Pages paths are case-sensitive; fix wrong-case /athar links (e.g. shared lowercase).
      var fixed = p.replace(/^\/athar(?=\/|$)/i, '/Athar');
      if (fixed !== p) {
        window.location.replace(fixed + window.location.search + window.location.hash);
        return;
      }
      if (p !== '/Athar/' && p !== '/Athar/index.html') {
        window.location.replace('/Athar/');
      }
    })();
  </script>
</head>
<body style="background:#0F3D2A;color:#E8C24A;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <div style="text-align:center;">
    <p style="font-size:1.4rem;">جاري تحويلك إلى أثر…</p>
    <p><a style="color:#E8C24A;" href="/Athar/">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
  </div>
</body>
</html>
